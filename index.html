
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IRCTC Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;
        }
        .login-box {
            width: 360px;
            margin: 100px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }
        img {
            width: 120px;
            margin-bottom: 10px;
        }
        h2 {
            color: #213d77;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #ff7a00;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #e86c00;
        }
        .links {
            margin-top: 10px;
            font-size: 14px;
        }
        .links a {
            text-decoration: none;
            color: #213d77;
        }
    </style>
</head>
<body>

<div class="login-box">

    <!-- IRCTC Logo -->
    <img src="https://images.seeklogo.com/logo-png/18/1/irctc-india-logo-png_seeklogo-180379.png" alt="IRCTC Logo">

    <h2>IRCTC Login</h2>

    <input type="text" placeholder="User Name" required>
    <input type="password" placeholder="Password" required>

    <button>Login</button>

    <div class="links">
        <a href="#">Forgot Password?</a><br>
        <a href="#">New User? Register</a>
    </div>

</div>

</body>
</html>
