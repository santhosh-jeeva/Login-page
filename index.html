<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IRCTC Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background-image: url("https://wallpapercave.com/wp/wp12183315.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
        }

        .overlay {
            background: rgba(0, 0, 0, 0.45);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 360px;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        img {
            width: 120px;
            margin-bottom: 10px;
        }

        h2 {
            color: #213d77;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #ff7a00;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background: #e86c00;
        }

        .links {
            margin-top: 10px;
            font-size: 14px;
        }

        .links a {
            text-decoration: none;
            color: #213d77;
        }

        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="overlay">

    <div class="login-box">

        
        <img src="https://images.seeklogo.com/logo-png/18/1/irctc-india-logo-png_seeklogo-180379.png" alt="IRCTC Logo">

        <h2>IRCTC Login</h2>

        <input type="text" id="username" placeholder="User Name">
        <input type="password" id="password" placeholder="Password">

        <button onclick="validateLogin()">Login</button>

        <div class="error" id="errorMsg"></div>

        <div class="links">
            <a href="#">Forgot Password?</a><br>
            <a href="#">New User? Register</a>
        </div>

    </div>

</div>

<script>
    function validateLogin() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("errorMsg");

        errorMsg.textContent = "";

        if (username === "" || password === "") {
            errorMsg.textContent = "Please fill in all fields";
            return;
        }

        if (password.length < 6) {
            errorMsg.textContent = " Password must be at least 6 characters";
            return;
        }

        alert(" Login successful (Demo)");
    }
</script>

</body>
</html>
